name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Gradle Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

  migration-check:
    name: Schema Migration Validation (real MySQL)
    runs-on: ubuntu-latest
    # 위 test job은 H2로 돌아서 MySQL 전용 DDL 실패를 재현 못 하므로
    # (docs/DB_MIGRATION_RULES.md §8-1/§8-2), 이 job이 유일한 검증 지점이다.
    #
    # ⚠️ 이 잡이 실패해도 머지는 막히지 않는다 — 브랜치 보호의 필수 체크 목록에 없기 때문이다.
    #    막으려면 Settings → Branches 에서 "Schema Migration Validation (real MySQL)" 을
    #    필수 체크로 올려야 한다. 워크플로 파일만으로는 머지를 막을 수 없다.
    #    (전에는 이 자리에 "하드 게이트 — 실패 시 머지를 막는다"고 적혀 있었는데 사실이 아니었다.)
    #    다만 아래 docker job 이 이 잡을 needs 로 기다리므로, 실패하면 이미지 푸시는 막힌다.

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # PR 코드를 컴파일·실행하는 잡 — 러너에 git 자격증명을 남기지 않는다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run migration check (Testcontainers MySQL)
        run: ./gradlew migrationCheck --no-daemon

  docker:
    name: Build and Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    # migration-check 도 기다린다. 전에는 test 만 기다려서, Flyway 마이그레이션이 실제 MySQL에서
    # 깨져도 이미지가 그대로 Docker Hub 에 올라갔다 — 그 이미지는 뜨는 순간 부팅에 실패한다
    # (ddl-auto=validate · validate-on-migrate=true).
    # 배포될 수 없는 이미지를 레지스트리에 올리지 않는다.
    needs: [test, migration-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            sungjinmo/z-spring:develop
            sungjinmo/z-spring:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 이 잡은 이미지를 만들지 않고 IaC·컨테이너 설정 파일만 정적으로 본다 — 잘못된 설정을
  # 머지 전에 잡는다. 빌드가 없어서 몇 초면 끝난다.
  #
  # ★ scan-ref 는 리포 전체(.)다 — 의도적이다.
  #   CodeRabbit(PR #478)이 "Dockerfile 하나로 좁혀라, 안 그러면 나중에 Terraform·Kubernetes·
  #   Helm 이 들어올 때 검사 범위와 판정이 바뀐다"고 지적했으나 반영하지 않았다. 좁히면
  #   그 파일들이 조용히 검사 밖으로 빠지는데, 그게 이 게이트로 막으려던 바로 그 상황이다.
  #   새 IaC 가 HIGH 를 물고 들어오면 빨개지는 것이 맞다 — 범위가 늘어 판정이 바뀌는 건
  #   결함이 아니라 목적이다. 대신 스텝 이름을 실제 동작(리포 전체)에 맞춰 고쳤다.
  #
  # ⚠️ 지금 실제로 잡히는 파일은 Dockerfile 하나뿐이다(로그의 "Detected config files num=1").
  #    compose.yml 은 Trivy misconfig 스캐너에 compose 룰이 없어 검사되지 않는다 —
  #    compose 의 실수는 파일 자신의 가드로 막는다(REDIS_PASSWORD 미설정 시 기동 실패).
  #
  # ★ 차단이다(exit-code 1). 첫 실행에서 findings 0 을 확인했다
  #   (2026-08-13, PR #469 — Dockerfile 0건). 유예할 부채가 없으므로 0 에서 시작해 0 을 유지한다.
  trivy-config:
    name: Trivy · 설정 스캔
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Trivy — IaC·컨테이너 설정 검사 (리포 전체)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ────────────────────────────────────────────────────────────────────────────
  # 공급망 — 이 리포가 쓰는 의존성 목록을 GitHub 에 올린다.
  #
  # 목록 자체는 아무것도 막지 않는다. 뒤에 올 Dependency Review 가 "PR 이 새로 추가한
  # 의존성"만 골라 보기 위한 기준선이고, 이 잡이 그 기준선을 만든다.
  #
  # ⚠️ 왜 제출이 필요한가 — GitHub 은 pom.xml·package.json 은 알아서 읽지만 build.gradle
  #    은 읽지 못한다. 제출하지 않으면 목록이 빈다. 도입 시점(2026-08-13)에 실제로 비어
  #    있었다 — dependency-graph/sbom 이 404 였다.
  #
  # ★ 검사(dependency-review)는 이 PR 에 함께 넣지 않는다. 순서 때문이다 —
  #   검사는 base(develop)의 목록과 head 의 목록을 비교하는데, 목록을 만드는 잡이 바로
  #   이 PR 안에 있어서 머지 전에는 develop 에 목록이 존재할 수 없다. 그 상태로 검사를
  #   켜면 base 가 비어 보여 프로젝트의 기존 의존성 전부가 "새로 추가됨"으로 잡힌다
  #   (실제로 그렇게 돌려봤고, 요청 좌표로만 남는 httpcore5 5.4 처럼 고쳐서 없앨 수 없는
  #   항목까지 걸렸다). 이 잡이 develop 에서 한 번 돌아 기준선이 생긴 뒤 후속 PR 에서
  #   검사를 붙인다.
  #
  # 곁가지 — 목록이 차면 Dependabot "경보"(취약점 알림)도 그제서야 실제로 동작한다.
  #    Dependabot 자체는 2026-08-12(2a6d5650)에 걷어냈지만, 걷어낸 것은 자동 PR 을 올리는
  #    쪽이고 경보는 리포 설정에서 계속 켜져 있다. 알림만 오고 PR 은 안 올라온다.
  # ────────────────────────────────────────────────────────────────────────────
  dependency-submission:
    name: Dependency Submission (Gradle 의존성 목록)
    runs-on: ubuntu-latest

    # 이 잡만 쓰기 권한을 갖는다 — 워크플로 기본값(contents: read)을 여기서만 올린다.
    # Dependency Submission API 로 목록을 올리려면 쓰기가 필요하고, 다른 잡에는 필요 없다.
    #
    # ⚠️ 대가를 적어 둔다 — 이 잡은 PR 에 담긴 build.gradle 을 실행해서 의존성을 푼다.
    #    즉 PR 작성자가 쓴 빌드 로직이 쓰기 토큰을 가진 러너에서 돈다.
    #    같은 리포 브랜치로만 PR 을 올리는 지금 구성에서는 감수할 만하다(작성자가 이미
    #    푸시 권한자다). 포크에서 오는 PR 은 GitHub 이 토큰을 읽기로 내려주므로 이 잡이
    #    실패한다 — 외부 기여를 받기 시작하면 제출을 workflow_run 으로 떼어내야 한다.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 제출은 API 토큰으로 한다 — git 자격증명은 필요 없다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # PR 에서도, develop push 에서도 돈다 — 검사가 비교할 때 양쪽 목록이 다 있어야 한다.
      # develop 쪽이 없으면 base 가 비어 보여서 "전부 새로 추가됨"이 된다.
      - name: 의존성 목록 생성·제출
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          # 기본값은 아티팩트로도 남기는데, 여기선 제출만 하면 된다.
          dependency-graph: generate-and-submit
