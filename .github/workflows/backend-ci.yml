name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Gradle Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

  migration-check:
    name: Schema Migration Validation (real MySQL)
    runs-on: ubuntu-latest
    # 하드 게이트 — 실패 시 머지를 막는다. 위 test job은 H2로 돌아서 MySQL 전용 DDL 실패를
    # 재현 못 하므로(docs/DB_MIGRATION_RULES.md §8-1/§8-2), 이 job이 유일한 검증 지점이다.

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # PR 코드를 컴파일·실행하는 잡 — 러너에 git 자격증명을 남기지 않는다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run migration check (Testcontainers MySQL)
        run: ./gradlew migrationCheck --no-daemon

  docker:
    name: Build and Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 밀기 전에 먼저 로컬로 받아 스캔한다. 순서가 핵심이다 — 밀고 나서 스캔하면
      # 취약한 이미지가 이미 레지스트리에 올라가 있고, 그걸 당기는 쪽은 스캔 결과를 모른다.
      # 두 번 빌드하는 것처럼 보이지만 아래 push 단계는 이 빌드의 캐시를 그대로 쓴다.
      - name: 이미지 빌드 (로컬 적재 — 스캔용)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: z-spring:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # 이 이미지는 JRE 만 있는 게 아니다 — Dockerfile 이 ffmpeg 를 설치하고(21-23행),
      # 그 ffmpeg 가 회의 녹음을 파싱한다. 신뢰할 수 없는 미디어가 코덱 파서에 닿는 구조라
      # OS 패키지 CVE 표면이 실재한다.
      #
      # ★ 지금은 리포터다(exit-code 0). 도입 시점에 findings 를 본 적이 없어, 차단으로 켜면
      #   develop 배포가 첫날 멈출 수 있다. 첫 실행 결과를 보고 exit-code 1 로 올린다.
      #   올릴 때 이 주석도 함께 지울 것 — 안 지우면 정책과 코드가 어긋난 채로 남는다.
      - name: Trivy — 이미지 취약점 스캔 (리포터)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: z-spring:scan-target
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true    # 업스트림에 고칠 방법이 없는 건 우리가 할 수 있는 게 없다
          exit-code: "0"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            sungjinmo/z-spring:develop
            sungjinmo/z-spring:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 위 image 스캔은 develop push 에서만 돈다(이미지를 빌드하는 잡이 거기뿐이다). 이 잡은
  # PR 에서 돌면서 이미지를 만들지 않고 설정 파일만 본다 — Dockerfile · compose 의
  # 잘못된 설정을 머지 전에 잡는다. 빌드가 없어서 몇 초면 끝난다.
  #
  # ★ 리포터다(exit-code 0). 도입 시점에 findings 를 본 적이 없어 차단으로 켜면 모든 PR 이
  #   첫날 막힐 수 있다. 첫 실행 결과를 보고 정책을 정한다.
  trivy-config:
    name: Trivy · 설정 스캔 (리포터)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Trivy — Dockerfile·compose 설정 검사
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

  # ────────────────────────────────────────────────────────────────────────────
  # 공급망 — 이 리포가 쓰는 의존성 목록을 GitHub 에 올린다.
  #
  # 목록 자체는 아무것도 막지 않는다. 뒤에 올 Dependency Review 가 "PR 이 새로 추가한
  # 의존성"만 골라 보기 위한 기준선이고, 이 잡이 그 기준선을 만든다.
  #
  # ⚠️ 왜 제출이 필요한가 — GitHub 은 pom.xml·package.json 은 알아서 읽지만 build.gradle
  #    은 읽지 못한다. 제출하지 않으면 목록이 빈다. 도입 시점(2026-08-13)에 실제로 비어
  #    있었다 — dependency-graph/sbom 이 404 였다.
  #
  # ★ 검사(dependency-review)는 이 PR 에 함께 넣지 않는다. 순서 때문이다 —
  #   검사는 base(develop)의 목록과 head 의 목록을 비교하는데, 목록을 만드는 잡이 바로
  #   이 PR 안에 있어서 머지 전에는 develop 에 목록이 존재할 수 없다. 그 상태로 검사를
  #   켜면 base 가 비어 보여 프로젝트의 기존 의존성 전부가 "새로 추가됨"으로 잡힌다
  #   (실제로 그렇게 돌려봤고, 요청 좌표로만 남는 httpcore5 5.4 처럼 고쳐서 없앨 수 없는
  #   항목까지 걸렸다). 이 잡이 develop 에서 한 번 돌아 기준선이 생긴 뒤 후속 PR 에서
  #   검사를 붙인다.
  #
  # 곁가지 — 목록이 차면 Dependabot "경보"(취약점 알림)도 그제서야 실제로 동작한다.
  #    Dependabot 자체는 2026-08-12(2a6d5650)에 걷어냈지만, 걷어낸 것은 자동 PR 을 올리는
  #    쪽이고 경보는 리포 설정에서 계속 켜져 있다. 알림만 오고 PR 은 안 올라온다.
  # ────────────────────────────────────────────────────────────────────────────
  dependency-submission:
    name: Dependency Submission (Gradle 의존성 목록)
    runs-on: ubuntu-latest

    # 이 잡만 쓰기 권한을 갖는다 — 워크플로 기본값(contents: read)을 여기서만 올린다.
    # Dependency Submission API 로 목록을 올리려면 쓰기가 필요하고, 다른 잡에는 필요 없다.
    #
    # ⚠️ 대가를 적어 둔다 — 이 잡은 PR 에 담긴 build.gradle 을 실행해서 의존성을 푼다.
    #    즉 PR 작성자가 쓴 빌드 로직이 쓰기 토큰을 가진 러너에서 돈다.
    #    같은 리포 브랜치로만 PR 을 올리는 지금 구성에서는 감수할 만하다(작성자가 이미
    #    푸시 권한자다). 포크에서 오는 PR 은 GitHub 이 토큰을 읽기로 내려주므로 이 잡이
    #    실패한다 — 외부 기여를 받기 시작하면 제출을 workflow_run 으로 떼어내야 한다.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false   # 제출은 API 토큰으로 한다 — git 자격증명은 필요 없다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # PR 에서도, develop push 에서도 돈다 — 검사가 비교할 때 양쪽 목록이 다 있어야 한다.
      # develop 쪽이 없으면 base 가 비어 보여서 "전부 새로 추가됨"이 된다.
      - name: 의존성 목록 생성·제출
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          # 기본값은 아티팩트로도 남기는데, 여기선 제출만 하면 된다.
          dependency-graph: generate-and-submit
