name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Gradle Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

  migration-check:
    name: Schema Migration Validation (real MySQL)
    runs-on: ubuntu-latest
    # 하드 게이트 — 실패 시 머지를 막는다. 위 test job은 H2로 돌아서 MySQL 전용 DDL 실패를
    # 재현 못 하므로(docs/DB_MIGRATION_RULES.md §8-1/§8-2), 이 job이 유일한 검증 지점이다.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # PR 코드를 컴파일·실행하는 잡 — 러너에 git 자격증명을 남기지 않는다

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run migration check (Testcontainers MySQL)
        run: ./gradlew migrationCheck --no-daemon

  docker:
    name: Build and Push Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 밀기 전에 먼저 로컬로 받아 스캔한다. 순서가 핵심이다 — 밀고 나서 스캔하면
      # 취약한 이미지가 이미 레지스트리에 올라가 있고, 그걸 당기는 쪽은 스캔 결과를 모른다.
      # 두 번 빌드하는 것처럼 보이지만 아래 push 단계는 이 빌드의 캐시를 그대로 쓴다.
      - name: 이미지 빌드 (로컬 적재 — 스캔용)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: z-spring:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # 이 이미지는 JRE 만 있는 게 아니다 — Dockerfile 이 ffmpeg 를 설치하고(21-23행),
      # 그 ffmpeg 가 회의 녹음을 파싱한다. 신뢰할 수 없는 미디어가 코덱 파서에 닿는 구조라
      # OS 패키지 CVE 표면이 실재한다.
      #
      # ★ 지금은 리포터다(exit-code 0). 도입 시점에 findings 를 본 적이 없어, 차단으로 켜면
      #   develop 배포가 첫날 멈출 수 있다. 첫 실행 결과를 보고 exit-code 1 로 올린다.
      #   올릴 때 이 주석도 함께 지울 것 — 안 지우면 정책과 코드가 어긋난 채로 남는다.
      - name: Trivy — 이미지 취약점 스캔 (리포터)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: z-spring:scan-target
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true    # 업스트림에 고칠 방법이 없는 건 우리가 할 수 있는 게 없다
          exit-code: "0"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            sungjinmo/z-spring:develop
            sungjinmo/z-spring:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 위 image 스캔은 develop push 에서만 돈다(이미지를 빌드하는 잡이 거기뿐이다). 이 잡은
  # PR 에서 돌면서 이미지를 만들지 않고 설정 파일만 본다 — Dockerfile · compose 의
  # 잘못된 설정을 머지 전에 잡는다. 빌드가 없어서 몇 초면 끝난다.
  #
  # ★ 리포터다(exit-code 0). 도입 시점에 findings 를 본 적이 없어 차단으로 켜면 모든 PR 이
  #   첫날 막힐 수 있다. 첫 실행 결과를 보고 정책을 정한다.
  trivy-config:
    name: Trivy · 설정 스캔 (리포터)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다

      - name: Trivy — Dockerfile·compose 설정 검사
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"