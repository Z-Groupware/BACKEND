name: Gate 1 · Semgrep (QUERY_002 · TENANT_001 · AUTHZ_001)

# AI 코드 리뷰 루프 — Gate 1(정적 패턴) 중 Semgrep만. baseline-diff-only.
# ArchUnit(아키텍처 규칙) 게이트는 컨벤션 담당 팀원이 ArchitectureRulesTest를 추가하면 별도 잡으로 붙인다.
# 기존 사용처는 base 커밋 기준 baseline이라 통과하고, PR에서 새로 추가되는 것만 실패시킨다.
#
# 룰셋 2개를 함께 돌린다.
#   query.yml        — QUERY_002 (신규 @Query 금지)
#   tenant-authz.yml — TENANT_001(회사 경계 없는 파생 쿼리) · AUTHZ_001(@PreAuthorize 없는 엔드포인트)
# 후자는 이 리포에서 반복해서 터진 교차 회사 데이터 유출을 겨냥한 도메인 룰이다 —
# 범용 SAST가 못 잡는 자리라 직접 적는다(근거는 tenant-authz.yml 머리말).

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

# 이 게이트는 코드를 읽어 패턴만 본다 — 쓰기 권한이 필요한 일이 없다.
# 선언을 비워두면 저장소 기본값이 들어오는데, 그 기본값은 설정에 따라 쓰기까지 열린다.
permissions:
  contents: read

jobs:
  semgrep-query:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      # 버전 고정 — latest는 조용히 바뀌어 게이트 동작이 어느 날 달라진다(재현성).
      # digest 대신 버전 태그: Dependabot이 워크플로 container 이미지를 자동 갱신해주지 않아
      # digest로 박으면 손으로 계속 올려야 하고, 방치하면 낡은 엔진에 영구히 묶인다.
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Checkout (full history for baseline diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다
      - name: Gate 1 — Semgrep (신규 위반만 차단)
        run: >-
          semgrep scan
          --config review-loop/semgrep/query.yml
          --config review-loop/semgrep/tenant-authz.yml
          --baseline-commit ${{ github.event.pull_request.base.sha }}
          --error

  # 워크플로 파일 자체의 보안 검사. semgrep 이 애플리케이션 코드를 보는 것과 같은 층에서,
  # 이쪽은 CI 를 본다 — 러너가 PR 코드를 컴파일·실행하므로 워크플로가 뚫리면 토큰과
  # 시크릿이 함께 나간다.
  #
  # 차단인 이유: 결정론 도구고, 도입 시점에 findings 0 이다(2026-08-11 확인).
  # baseline 부채가 없으므로 유예할 것이 없다 — 0 에서 시작해 0 을 유지한다.
  zizmor:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install zizmor
        run: pip install zizmor==1.29.0   # 버전 고정 — 룰이 늘면 어느 날 갑자기 빨개진다
      - name: Gate 1 — zizmor (워크플로 보안)
        # --no-online-audits: 온라인 감사는 GitHub API 를 부르는데, 여기선 토큰 없이 돌린다.
        run: zizmor --no-online-audits --min-severity medium .github/workflows/
