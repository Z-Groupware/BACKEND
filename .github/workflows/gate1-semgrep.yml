name: Gate 1 · Semgrep (QUERY_002 · TENANT_001 · AUTHZ_001)

# AI 코드 리뷰 루프 — Gate 1(정적 패턴) 중 Semgrep만. baseline-diff-only.
# ArchUnit(아키텍처 규칙) 게이트는 컨벤션 담당 팀원이 ArchitectureRulesTest를 추가하면 별도 잡으로 붙인다.
# 기존 사용처는 base 커밋 기준 baseline이라 통과하고, PR에서 새로 추가되는 것만 실패시킨다.
#
# 룰셋 2개를 함께 돌린다.
#   query.yml        — QUERY_002 (신규 @Query 금지)
#   tenant-authz.yml — TENANT_001(회사 경계 없는 파생 쿼리) · AUTHZ_001(@PreAuthorize 없는 엔드포인트)
# 후자는 이 리포에서 반복해서 터진 교차 회사 데이터 유출을 겨냥한 도메인 룰이다 —
# 범용 SAST가 못 잡는 자리라 직접 적는다(근거는 tenant-authz.yml 머리말).

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

# 이 게이트는 코드를 읽어 패턴만 본다 — 쓰기 권한이 필요한 일이 없다.
# 선언을 비워두면 저장소 기본값이 들어오는데, 그 기본값은 설정에 따라 쓰기까지 열린다.
permissions:
  contents: read

jobs:
  semgrep-query:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    container:
      # 버전 고정 — latest는 조용히 바뀌어 게이트 동작이 어느 날 달라진다(재현성).
      # digest 대신 버전 태그를 쓴다: semgrep 은 버전 태그를 다시 밀지 않으므로 태그만으로도
      # 재현성이 확보되고, 사람이 읽어 어느 엔진인지 바로 알 수 있다. digest 는 불투명해서
      # 올릴 때마다 대조가 필요하다.
      # ⚠️ 이 이미지를 갱신하는 자동 수단은 없다(Dependabot 을 걷어냈다) — 손으로 올려야 한다.
      image: semgrep/semgrep:1.172.0
    steps:
      - name: Checkout (full history for baseline diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다
      - name: Gate 1 — Semgrep (신규 위반만 차단)
        run: >-
          semgrep scan
          --config review-loop/semgrep/query.yml
          --config review-loop/semgrep/tenant-authz.yml
          --baseline-commit ${{ github.event.pull_request.base.sha }}
          --error
