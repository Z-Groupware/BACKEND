name: Gate 2 · LLM Judge

# AI 코드 리뷰 루프 — Gate 2(의미규칙 LLM 판정) 게이트.
#  - gate2-deterministic : 키 불필요. 채점·근거검증(Evidence)·정규화 등 "코드가 판단"하는 결정론 로직 검증(하드 게이트).
#                          ※ 루프 자신의 로직을 검증한다 — PR 코드를 리뷰하지 않는다.
#  - gate2-review        : PR의 변경 .java를 실제로 LLM 판정하는 유일한 잡(하드 게이트).
#                          로컬 pre-push 훅과 동일한 `reviewLoop --gate` → Critical/미완성만 차단.
#  - gate2-live-judge    : golden 씨앗 기준 어댑터·프롬프트 회귀 감시(스모크). informational.
#                          ※ 이것도 PR 코드를 리뷰하지 않는다 — 연동이 살아있는지만 본다.
# fork PR엔 secret이 주입되지 않으며, 키가 비면 라이브 테스트는 @EnabledIf로 자동 skip된다.

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

# 워크플로 전역은 최소 권한(읽기)만. 쓰기 권한은 실제로 필요한 잡에서만 승격한다.
permissions:
  contents: read

jobs:
  gate2-deterministic:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # 테스트 결과 게시(check-run)용 — 이 잡에만 필요
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x gradlew
      # reviewloop.judge.* 전체 실행. 라이브(Gemini*/Claude*)는 키가 없으므로 @EnabledIf로 skip된다.
      - name: Gate 2 — 결정론 판정 로직 검증 (키 불필요)
        run: >-
          ./gradlew test
          --tests "com.module06.backend.reviewloop.judge.*"
          --no-daemon
      - name: Publish Gate 2 (결정론) 결과
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        continue-on-error: true
        with:
          files: build/test-results/test/*.xml
          check_name: "Gate 2 · 결정론 판정"

  # PR 코드를 실제로 LLM 판정하는 유일한 잡(하드 게이트).
  # 로컬 pre-push 훅과 같은 명령·같은 기준(--gate)을 쓴다 → Critical/미완성이면 차단, Minor는 통과.
  # 이 잡이 있어야 `git push --no-verify`로 로컬 훅을 건너뛴 코드도 머지 전에 판정을 받는다.
  #
  # 비결정성 우려가 낮은 이유: RuleCatalog.normalize()가 LLM이 뱉은 severity를 카탈로그 값으로
  # 덮어쓰고 카탈로그에 없는 ruleId는 버린다 → LLM 변덕으로 CRITICAL이 만들어질 수 없다.
  # 점수 지터(Minor)는 --gate가 차단하지 않으므로 머지를 막지 않는다.
  gate2-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (base까지 — 변경 파일 diff용)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # PR 코드를 실행하는 잡 — git 자격증명을 남기지 않는다
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: 변경 .java 목록 추출 (훅의 diff 로직과 동일 기준)
        id: changed
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -E '\.java$' > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "변경 .java $(wc -l < changed.txt)개:"
          cat changed.txt
      # fork PR엔 secret이 주입되지 않는다 → 러너가 "키 없음 → 생략·통과"로 exit 0 (머지를 막지 않음).
      # --max는 훅 기본값(5)보다 크게: 차단 게이트에서 상한 초과분이 리뷰 없이 통과하는 구멍을 줄인다.
      - name: Gate 2 — PR 코드 판정 (Critical·미완성이면 차단)
        if: steps.changed.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          ./gradlew -q reviewLoop
          --args="--files-from changed.txt --gate --max 20"
          --no-daemon

  # 어댑터·프롬프트 회귀 감시용 스모크 테스트(golden 씨앗 기준). PR 코드를 리뷰하지 않는다.
  # LLM 비결정성 때문에 informational — 실패해도 merge를 막지 않는다(하드 게이트는 위 두 잡).
  gate2-live-judge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Gate 2 — 라이브 Judge (Gemini, secret 주입)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          ./gradlew test
          --tests "com.module06.backend.reviewloop.judge.Gemini*LiveTest"
          --no-daemon
