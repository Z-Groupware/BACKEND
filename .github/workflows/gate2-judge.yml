name: Gate 2 · LLM Judge

# AI 코드 리뷰 루프 — Gate 2(의미규칙 LLM 판정) 게이트.
#  - gate2-deterministic : 키 불필요. 채점·근거검증(Evidence)·정규화 등 "코드가 판단"하는 결정론 로직 검증(하드 게이트).
#                          ※ 루프 자신의 로직을 검증한다 — PR 코드를 리뷰하지 않는다.
#  - gate2-review        : PR의 변경 .java를 실제로 LLM 판정하는 유일한 잡.
#                          로컬 pre-push 훅과 동일한 `reviewLoop --gate`. ★ 정책상 리포터 — 머지를 막지 않는다
#                          (차단 경로가 비어 있다 · 근거는 아래 잡 주석 · 정책은 review-loop/DRIVER.md).
#  - gate2-live-judge    : golden 씨앗 기준 어댑터·프롬프트 회귀 감시(스모크). informational.
#                          ※ 이것도 PR 코드를 리뷰하지 않는다 — 연동이 살아있는지만 본다.
# fork PR엔 secret이 주입되지 않으며, 키가 비면 라이브 테스트는 @EnabledIf로 자동 skip된다.

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

# 워크플로 전역은 최소 권한(읽기)만. 쓰기 권한은 실제로 필요한 잡에서만 승격한다.
permissions:
  contents: read

jobs:
  gate2-deterministic:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write        # 테스트 결과 게시(check-run)용 — 이 잡에만 필요
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # 러너에 git 자격증명을 남기지 않는다
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x gradlew
      # reviewloop.judge.* 전체 실행. 라이브(Gemini*/Claude*)는 키가 없으므로 @EnabledIf로 skip된다.
      - name: Gate 2 — 결정론 판정 로직 검증 (키 불필요)
        run: >-
          ./gradlew test
          --tests "com.module06.backend.reviewloop.judge.*"
          --no-daemon
      - name: Publish Gate 2 (결정론) 결과
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2
        if: always()
        continue-on-error: true
        with:
          files: build/test-results/test/*.xml
          check_name: "Gate 2 · 결정론 판정"

  # PR 코드를 실제로 LLM 판정하는 유일한 잡. 로컬 pre-push 훅과 같은 명령·같은 기준(--gate)을 쓴다.
  # 이 잡이 있어야 `git push --no-verify`로 로컬 훅을 건너뛴 코드도 머지 전에 판정을 받는다.
  #
  # ★ 정책상 리포터 — 머지를 막지 않는다(review-loop/DRIVER.md).
  #   normalize()가 LLM severity를 카탈로그 값으로 덮으므로 CRITICAL finding이 만들어질 수 없고,
  #   acceptance 판정은 미배선이라 INCOMPLETE도 도달 불가 → --gate의 차단 경로가 비어 있다.
  #   즉 LLM 변덕으로 머지가 막히는 일은 구조적으로 없고, 동시에 LLM이 머지를 지켜주지도 않는다.
  #   차단은 결정론 게이트(gate1-semgrep · gate2-deterministic) 몫이다.
  #   단 스텝은 계속 실패할 수 있다 — '게이트 오류'(키·네트워크 등 리뷰 미수행)일 때다. 그건 고쳐야 한다.
  #   정책이 뒤집히면(rules.yaml에 CRITICAL judge 규칙 추가) 이 잡이 자동으로 차단 게이트가 된다.
  gate2-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (base까지 — 변경 파일 diff용)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false   # PR 코드를 실행하는 잡 — git 자격증명을 남기지 않는다
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: 변경 .java 목록 추출 (훅의 diff 로직과 동일 기준)
        id: changed
        run: |
          # architecture/fixture/ 제외 — 훅과 동일. ARCH 규칙 자기검증용 '의도적 위반' 픽스처라
          # 영구히 위반 상태여야 하고, 판정에 넣으면 고칠 수 없는 Minor가 매 PR에 반복된다.
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep -E '\.java$' | grep -v '/architecture/fixture/' > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          echo "변경 .java $(wc -l < changed.txt)개:"
          cat changed.txt
      # fork PR엔 secret이 주입되지 않는다 → 러너가 "키 없음 → 생략·통과"로 exit 0 (머지를 막지 않음).
      # --max는 훅 기본값(5)보다 크게: 차단 게이트에서 상한 초과분이 리뷰 없이 통과하는 구멍을 줄인다.
      - name: Gate 2 — PR 코드 LLM 판정 (리포터 · 차단은 결정론 게이트 몫)
        if: steps.changed.outputs.count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          ./gradlew -q reviewLoop
          --args="--files-from changed.txt --gate --max 20"
          --no-daemon

  # 어댑터·프롬프트 회귀 감시용 스모크 테스트(golden 씨앗 기준). PR 코드를 리뷰하지 않는다.
  # LLM 비결정성 때문에 informational — 실패해도 merge를 막지 않는다(하드 게이트는 위 두 잡).
  gate2-live-judge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Gate 2 — 라이브 Judge (Gemini, secret 주입)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >-
          ./gradlew test
          --tests "com.module06.backend.reviewloop.judge.Gemini*LiveTest"
          --no-daemon

      # 실패 원인은 리포트에만 온전히 남는다(응답 본문·스택). 로그만으로는 판별이 안 되는 상황을
      # 실제로 겪었다 — 2026-08-05, 5건 실패에 HTTP 상태코드가 없어 키·쿼터·모델 id 중 무엇인지
      # 알 수 없었다. 키는 x-goog-api-key 헤더로만 가므로 리포트에 키가 섞이지 않는다.
      - name: 실패 시 테스트 리포트 업로드 (원인 판별용)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gate2-live-judge-report
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
          # 이 스텝은 failure() 일 때만 돈다 — 즉 테스트가 실제로 실패했다는 뜻이고, 그러면
          # 리포트가 있어야 정상이다. ignore 로 두면 경로가 바뀌거나 리포트 생성이 깨졌을 때
          # 조용히 성공해서, 원인을 보려고 들어온 사람이 빈손으로 돌아간다.
          # error 는 쓰지 않는다 — 진단용 업로드가 실패해서 잡을 더 빨갛게 만들 이유가 없다.
          if-no-files-found: warn
