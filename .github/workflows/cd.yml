name: CD (Spring Deploy)

# main에 반영되면 배포. develop→(CI/게이트)→main 흐름의 마지막 단계.
# backend-ci.yml(별도 PR)은 develop에서 테스트+이미지 빌드/푸시까지 담당하고,
# 이 워크플로는 main 기준으로 이미지 빌드/푸시 + EC2 실제 배포(OIDC+SSM)를 담당한다.
on:
  push:
    branches: [main]
  workflow_dispatch:            # 수동 실행도 허용 (인프라 준비 중 검증용)

permissions:
  id-token: write               # OIDC 토큰 발급 (액세스 키 없이 IAM 역할 assume)
  contents: read

env:
  AWS_REGION: ap-northeast-2
  IMAGE: sungjinmo/z-spring      # backend-ci.yml과 동일 이미지 (PR #8 기준)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 배포는 커밋 SHA 태그로만 한다(deploy.sh 가 SHA 인자로 pull).
      # 어떤 이미지가 운영에 떠 있는지 태그=커밋으로 1:1 추적되도록 latest 는 밀지 않는다.
      - name: 이미지 빌드 & 푸시 (커밋 SHA 태그)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          # 캐시 export 실패가 배포를 막지 않도록 ignore-error=true (기본값 false)
          cache-to: type=gha,mode=max,ignore-error=true

      - name: AWS 인증 (OIDC — 액세스 키 없음)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 배포 Role ARN은 AWS_DEPLOY_ROLE_ARN Repository Variable에서 가져옴
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ALB 없음 → 롤링/드레이닝 로직 불필요. Spring EC2에 SSM으로 deploy.sh 호출만.
      # deploy.sh 는 각 EC2의 /opt/itta/deploy.sh 에 미리 배치돼 있어야 함.
      - name: Spring EC2에 배포 (SSM)
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=spring" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "실행 중인 spring 인스턴스가 없습니다"; exit 1
          fi
          echo "배포 대상: $INSTANCE_IDS"

          # 이번 커밋 SHA 태그로 배포 (deploy.sh 첫 번째 인자)
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --parameters commands="[\"sudo /opt/itta/deploy.sh ${{ github.sha }}\"]" \
            --comment "CD Spring ${{ github.sha }}" \
            --query "Command.CommandId" --output text)

          echo "SSM Command: $COMMAND_ID"

          # 인스턴스별 완료 대기 + 로그 출력
          FAIL=0
          for id in $INSTANCE_IDS; do
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$id" || FAIL=1
            echo "----- $id 결과 -----"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$id" \
              --query "{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}" \
              --output json
          done
          exit $FAIL
