# Dependabot — 취약 의존성 알림과 갱신 PR.
#
# 두 생태계를 본다.
#   gradle         : jjwt(토큰 검증) · spring-boot-starter-security · AWS SDK 처럼
#                    보안 경로에 직접 물린 의존성이 많다.
#   github-actions : 워크플로가 PR 코드를 러너에서 컴파일·실행한다. 액션이 변조되면
#                    그 러너의 토큰과 시크릿이 함께 나간다.
#
# ★ github-actions 는 SHA 고정과 한 세트다. 액션을 SHA 로 박으면 사람 눈으로는 어느 버전인지
#   알 수 없고 손으로 올리기도 어려운데, Dependabot 이 SHA 를 대신 갱신해준다.
#
#   `# v4` 같은 후행 태그 주석은 갱신의 조건이 아니다 — 주석이 없어도 SHA 는 갱신된다.
#   주석의 역할은 "이 SHA 가 어느 버전인가"를 사람이 읽을 수 있게 하는 것이고,
#   Dependabot 이 SHA 를 올릴 때 이 주석도 함께 올려준다(2022-10 부터).
#   그래서 지우면 갱신이 멈추는 게 아니라, 리뷰어가 버전을 알아볼 수 없어진다. 남겨 둘 것.
#
#   ⚠️ 주석이 항상 정확하게 유지되지는 않는다. 태그가 직접 달리지 않은 커밋으로 갱신되면
#      SHA 만 바뀌고 주석이 낡은 채 남는 사례가 보고돼 있다(dependabot-core#14716).
#      주석은 참고용으로 보고, 정확한 버전이 필요하면 SHA 를 직접 조회할 것.
#
# 정책: 리포터다(머지를 막지 않는다). Dependabot 이 여는 것은 PR 이고, 그 PR 은 다른 PR 과
#       똑같이 Gate 1·CI 를 통과해야 한다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5   # 한 번에 쏟아지면 아무도 안 본다
    labels:
      - dependencies
    commit-message:
      prefix: "[CHORE]"           # 팀 커밋 컨벤션(대괄호 태그)에 맞춘다

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "[CHORE]"
