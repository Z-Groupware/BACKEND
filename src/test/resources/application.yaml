spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  # 테스트 스키마는 Hibernate create-drop(H2)이 소유. Flyway 마이그레이션은 MySQL 전용 DDL
  # (ENGINE=InnoDB / JSON / ENUM 등)이라 H2에 실행하지 않는다. 마이그레이션 검증은 실제 MySQL에서.
  flyway:
    enabled: false

# ── JWT ──
# ⚠️ 이 파일은 main 의 application.yaml 을 **가린다**(같은 이름이 테스트 클래스패스에서 우선).
#    따라서 main 에 키를 추가하면 여기에도 넣어야 한다. 안 넣으면 스프링 컨텍스트를 띄우는
#    모든 테스트가 "JwtProperties.secret() is null" 로 한꺼번에 죽는다.
# 값은 아무 64자 hex 여도 된다 — 테스트는 발급과 검증을 같은 키로만 한다.
jwt:
  secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  access-ttl: 30m
  refresh-ttl-default: 1d
  refresh-ttl-extended: 14d

# ── 캡처 배경 워커 ──
# few-shot 예시 색인 워커(AI-08)를 테스트에서는 끈다. 켜 두면 컨텍스트를 띄우는 모든 테스트가
# 1분마다 AI 서버로 나가려다 실패해 로그가 그 오류로 덮인다 — 정작 봐야 할 실패가 묻힌다.
# 워커 자체의 동작은 TupleVectorSyncServiceTest 가 직접 호출해 검증한다.
capture:
  vector-sync:
    enabled: false

# ── AI EC2 (Python 계층 서버) ──
# 위 경고와 같은 이유로 여기에도 둔다. main 의 ai.* 는 부팅 시 검증되므로(AiLayerProperties)
# 이 블록이 없으면 컨텍스트를 띄우는 테스트가 전부 "ai.base-url is blank" 로 죽는다.
# 테스트는 실제로 AI 서버를 부르지 않는다 — 값이 있다는 것만 필요하다.
ai:
  base-url: http://localhost:8000
  internal-token: test-internal-token
  connect-timeout: 1s
  read-timeout: 5s

# ── CAP-13 자막 SSE Redis pub/sub ──
# RedisMessageListenerContainer는 빈이 뜨자마자 실제로 Redis에 연결을 시도한다(지연 연결 아님).
# CI엔 Redis 서비스가 없어서 켜두면 cap과 무관한 도메인까지 포함해 전체 @SpringBootTest가 깨진다.
cap:
  captions:
    sse:
      enabled: false