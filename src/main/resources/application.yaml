spring:
  application:
    name: backend

  # 로컬 개발용 비밀값은 프로젝트 루트의 application-secret.yml 에 둔다(.gitignore 처리, 커밋 금지).
  # ⚠️ classpath(src/main/resources) 가 아니라 외부 file: 경로다.
  #    resources 에 두면 .gitignore 와 무관하게 processResources 가 jar 에 담고,
  #    Dockerfile 의 COPY src 로 이미지에도 들어간다.
  # optional: 이므로 파일이 없어도 부팅에 실패하지 않는다 — 운영/스테이징은 파일 없이
  # SSM Parameter Store 가 주입한 환경변수를 쓰며, 환경변수가 이 파일보다 우선한다.
  config:
    import: optional:file:./application-secret.yml

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ------------ Redis ---------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}   # 스키마 주인은 Flyway. validate 이상은 쓰지 않는다.

  # ── Flyway (담당자별 버전 영역 + out-of-order 협업) ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true     # checksum 불일치(=적용 파일 수정) 시 부팅 실패

    # 개발 환경은 허용(담당자별 레인이 순서 무관하게 병합됨), 운영은 false 로 내린다.
    # 운영은 "머지 순서 = 배포 순서"를 강제하므로 SSM 에 FLYWAY_OUT_OF_ORDER=false 를 둔다.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}

    # baseline 은 끈다. 이 프로젝트에는 마이그레이션 이력 없이 스키마만 있는
    # 레거시 DB가 존재하지 않는다. 켜두면 테이블이 일부만 있는 DB를 "V1 완료"로
    # 등록해 V1 을 건너뛰고, 깨진 스키마가 조용히 통과한다.
    # 실제 레거시 DB를 인계받는 경우에만 그 배포에 한해 켠다.
    baseline-on-migrate: false

  # ── 메일(Gmail SMTP) ──
  # prod 프로파일에서만 GmailAccountMailAdapter 가 이 설정으로 JavaMailSender 를 쓴다.
  # 로컬/테스트는 LoggingAccountMailAdapter(@Profile("!prod"))가 대신하므로 값이 없어도 부팅된다.
  # username/password 는 SSM 이 주입한다 — Gmail 계정 비밀번호가 아니라 앱 비밀번호(2단계 인증 필요)다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── CORS ──
# 프론트가 이 오리진에서만 API 를 부를 수 있다. 브라우저가 preflight(OPTIONS)로 막기 때문에
# 여기 없는 오리진은 요청 자체가 서버에 닿기 전에 실패한다 — 401 이 아니라 CORS 에러로 보인다.
# 로컬 프론트 기본 포트(3000)만 우선 넣었다. 배포 도메인이 정해지면 SSM 에
# CORS_ALLOWED_ORIGINS=https://실제도메인,http://localhost:3000 형태(콤마 구분)로 추가한다.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── JWT ──
# secret 은 application-secret.yml 에서 온다. hex 문자열이며 디코드한 raw 바이트가 키다 —
# HS256 이라 디코드 후 최소 32바이트(= 64자 hex)여야 하고, 짧거나 hex 가 아니면 키 생성
# 단계에서 즉시 예외가 나 부팅에서 걸린다(런타임까지 미뤄지지 않는다).
# 이 값이 바뀌면 이미 발급된 모든 토큰이 무효가 된다.
# ── 횟수 제한 ──
# 한 사무실에서 직원 수십 명이 IP 하나를 공유한다. 그래서 경로마다 값이 다르다 —
# 전부 같은 숫자로 두면 공격자에게 넉넉하거나 사무실을 막거나 둘 중 하나가 된다.
#
# ⚠️ 이 값들이 뜻을 가지려면 아래 server.forward-headers-strategy 가 켜져 있어야 한다.
#    꺼져 있으면 모든 요청이 리버스 프록시 주소 하나로 뭉쳐, 서비스 전체가 한 카운터를 쓴다.
rate-limit:
  # 아침 출근 시간에 한 사무실에서 몰린다. 넉넉히 두고, 진짜 방어는 아래 계정 기준이 한다.
  login-per-ip:
    limit: 60
    window: 1m
  # 무차별 대입 방어의 본체. 실패만 세므로 잘 쓰는 사용자는 닿지 않는다.
  login-per-account:
    limit: 5
    window: 5m
  # 액세스 토큰(30분)이 만료될 때마다 사람 수만큼 나가는 경로라 가장 넉넉하다.
  # 그래도 거는 이유: permitAll 인 데다 BCrypt 비용도 없어 가장 싸게 두들길 수 있다.
  refresh-per-ip:
    limit: 120
    window: 1m
  # ⚠️ CompanyCodeGenerator javadoc 이 전수 탐색 난이도를 계산할 때 이 값(분당 20회)을
  #    전제한다. 올리면 그 계산이 무너지므로 함께 고쳐야 한다.
  company-lookup-per-ip:
    limit: 20
    window: 1m
  # 성공하면 회사와 오너 계정이 생기고 되돌릴 경로가 없다. 사람이 반복할 일이 아니다.
  registration-per-ip:
    limit: 5
    window: 1m

server:
  # 컨테이너는 리버스 프록시 뒤에 있다. 이 설정이 없으면 getRemoteAddr() 이 프록시 주소만 줘서
  # 위 IP 기준 제한이 전부 한 카운터로 합쳐지고, 감사 로그의 출처도 전부 같은 값이 된다.
  #
  # ⚠️ 전제 — 프록시가 X-Forwarded-For 를 신뢰할 수 있게 세팅해야 한다. 클라이언트가 보낸
  #    헤더를 프록시가 그대로 흘려보내면 공격자가 IP 를 위조해 제한을 우회한다.
  #    (nginx: proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; ALB 는 기본 동작)
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-ttl: 30m
  refresh-ttl-default: 1d      # keepSignedIn = false — 표 한 장의 수명
  refresh-ttl-extended: 14d    # keepSignedIn = true  — 표 한 장의 수명
  # 최초 로그인 이후 표를 이어붙일 수 있는 총 기간. 위 두 값은 재발급마다 새로 계산되므로
  # 이 상한이 없으면 14일마다 한 번 갱신하는 것만으로 세션이 영원히 산다 — 탈취된 갱신표가
  # 영구 세션이 된다는 뜻이다. 넘기면 재로그인을 요구한다.
  refresh-absolute-max: 30d

# ── AI EC2 (Python 계층 서버) ──
# 인스턴스 간 호출이라 localhost 가 아니다. 보안그룹이 Spring EC2 에서만 인바운드를
# 허용하지만 internal-token 은 그것과 **별도로** 둔다 — 같은 VPC 안의 다른 인스턴스가
# 뚫렸을 때 방어선이 하나도 없는 상태가 되지 않게.
#
# internal-token 은 Python 쪽 INTERNAL_TOKEN 과 **같은 값**이어야 한다.
# 운영은 SSM /z/prod/ 와 /z/ai/prod/ 양쪽에 같은 값을 둔다(AI 롤은 /z/ai/prod/* 만 읽는다).
#
# read-timeout 이 길다. 계층 하나가 회의 전체 발화를 읽고 LLM 을 부르므로 분 단위다 —
# 짧게 잡으면 정상 동작이 타임아웃으로 실패하고 재시도가 같은 토큰을 다시 태운다.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  internal-token: ${INTERNAL_TOKEN:}
  connect-timeout: 5s
  read-timeout: 3m

# ── CAP 녹음 오브젝트 스토리지(S3) ──
# 리전은 하드코딩(CapS3ClientConfig) — 이 프로젝트가 쓰는 유일한 리전이고, infra/deploy.sh의
# AWS CLI 호출도 이미 ap-northeast-2를 하드코딩해서 쓴다(SSM 파라미터를 하나 더 늘리지 않는다).
# 자격증명은 EC2 인스턴스 IAM 역할(DefaultCredentialsProvider)로 받는다 — 액세스키를 SSM에
# 따로 안 둔다. prod 프로파일에서만 빈이 뜨므로 로컬/테스트는 이 값이 없어도 부팅된다.
cap:
  s3:
    bucket: ${S3_BUCKET:}

# ── STT(AWS Transcribe) ──
# 버킷은 cap.s3.bucket과 **같은 환경변수**를 읽는다. SSM 파라미터를 하나 더 늘리지 않는다 —
# 블록 오디오를 쓰는 쪽(cap)과 그걸 Transcribe에 넘기는 쪽(capture)이 같은 버킷을 봐야 하고,
# 값을 두 곳에 두면 한쪽만 바뀌는 순간 제출은 성공하는데 오디오가 없는 상태가 된다.
# 프로퍼티 키를 도메인별로 나눈 것은 바인딩 소유권을 나누기 위함이다(같은 prefix에 두 레코드를
# 매핑하지 않는다).
stt:
  transcribe:
    bucket: ${S3_BUCKET:}
    # 결과 JSON이 쌓이는 접두사. 오디오(stt-temp/)와 나누는 이유 — 오디오는 조립이 끝나면
    # 지우는 임시 파일이고 결과는 재처리·감사에 다시 읽는다. 수명 정책이 다르면 접두사도 달라야
    # S3 라이프사이클 규칙을 각각 걸 수 있다.
    output-prefix: stt-out/

# ── 프로젝트 첨부파일 오브젝트 스토리지(S3) ──
# CAP과 같은 버킷(S3_BUCKET)을 재사용한다 — SSM 파라미터를 늘리지 않고 prefix(project-attachments/...
# vs recordings/...)로만 구분한다. ProjectAttachmentS3Properties 주석 참고.
project:
  attachment:
    s3:
      bucket: ${S3_BUCKET:}

# Prometheus 설정
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never