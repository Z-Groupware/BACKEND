spring:
  application:
    name: backend

  # 로컬 개발용 비밀값은 application-secret.yml 에 둔다(.gitignore 처리, 커밋 금지).
  # optional: 이므로 파일이 없어도 부팅에 실패하지 않는다 — 운영/스테이징은 파일 없이
  # SSM Parameter Store 가 주입한 환경변수를 쓰며, 환경변수가 이 파일보다 우선한다.
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}   # 스키마 주인은 Flyway. validate 이상은 쓰지 않는다.

  # ── Flyway (담당자별 버전 영역 + out-of-order 협업) ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true            # 낮은 버전이 뒤늦게 병합돼도 1회 끼워넣기 적용
    validate-on-migrate: true     # checksum 불일치(=적용 파일 수정) 시 부팅 실패
    # 기존 스키마가 이미 있는 운영 DB를 V1 baseline 으로 등록 후 V2.x 부터 적용.
    # 완전히 빈 DB 는 baseline 대상이 아니라 V1 이 그대로 실행된다.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: init_schema