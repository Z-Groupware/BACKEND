services:
  redis:
    image: redis:8.8.1-alpine
    container_name: z-redis-local
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    command:
      - sh
      - -ec
      - |
        # 빈 비밀번호로 뜨는 것을 막는다. .env 가 없으면 compose 는 경고 한 줄만 남기고
        # 빈 문자열을 넘기는데, 그러면 --requirepass "" 로 '무인증 Redis'가 조용히 기동된다.
        # 실패가 아니라 조용한 성공이라 아무도 모른다 → 여기서 끊는다(운영 compose 와 동일한 가드).
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required — 프로젝트 루트 .env 를 확인하세요(.env.example 참고)}"

        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --requirepass "$${REDIS_PASSWORD}"

    volumes:
      - redis-local-data:/data

    mem_limit: 256m

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-local-data: