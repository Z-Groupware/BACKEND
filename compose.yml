services:
  redis:
    image: redis:8.8.1-alpine
    container_name: z-redis-local
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$${REDIS_PASSWORD}"

    volumes:
      - redis-local-data:/data

    mem_limit: 256m

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis-local-data: