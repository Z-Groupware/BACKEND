# ============================================================================
# 규칙 카탈로그 (SSOT) — v1.0
# 줄글 팀 규칙 → ID + 집행(enforced_by) + severity + 근거.
# Gate 1(결정론)·Gate 2(Judge)·점수 산출이 모두 이 파일을 단일 출처로 참조한다.
#
# status 의미 (정직하게 구분):
#   verified_green : 이 레포에서 실제로 검증됨, 통과
#   baseline       : 실제 위반이 있어 baseline으로 얼림(신규만 차단)
#   claimed        : 카탈로그 주장값 — 아직 테스트로 미검증 (검증 필요)
#   judge_pending  : LLM Judge 몫, Judge/Promptfoo 미구현
# ============================================================================

version: "1.0"

meta:
  gates:
    gate1: "결정론 (ArchUnit·Semgrep·test) — 비용 0. 위반 시 severity 분기."
    gate2: "LLM Judge (의미규칙만) — 정적분석이 원천적으로 못 잡는 것."
  severity:
    CRITICAL: "걸리면 무조건 사람 승인 (자동수정·머지 금지)"
    MINOR: "자동수정 루트 허용 (≤3회)"
  score:
    formula: "100 - Σ(weight)  — LLM이 아니라 코드가 결정론으로 계산. acceptance는 가중치 제외."
    pass_threshold: 80         # score >= 80 → PASS, 미만 → 재수정 (Critical은 점수 무관 사람 승인)
    default_weight:            # 규칙별 weight 미지정 시 severity 기본 감점
      CRITICAL: 40
      MINOR: 10
    judge_default_weight: 15   # 의미규칙(judge) 기본 감점

rules:
  # ── CRITICAL — 결제·보안·도메인 고정값 (걸리면 무조건 사람) ──────────────
  - id: SEC_001
    text: "인증코드 3분·인증완료 5분·JWT 30분/14일 고정값"
    severity: CRITICAL
    enforced_by: test
    evidence: "application.yaml:84-85,125"
    status: claimed        # 카탈로그 주장 — 검증 테스트 필요

  - id: SEC_002
    text: "로그인 5회 잠금 · 비번 재발급 3회 · 재사용 금지"
    severity: CRITICAL
    enforced_by: test
    evidence: "Member.java:17 (MAX_LOGIN_FAIL_COUNT=5) / application.yaml:129"
    test_ref: "MemberLoginLockTest"
    status: verified_green   # ✅ '5회 잠금'만 검증. 재발급 3회·재사용 금지는 아직 미검증(별도)

  - id: DOM_001
    text: "구독료 = (수능일까지 일수) × 30,000원 공식 (수능일 2026-11-19, 롤오버로 0/음수 없음)"
    severity: CRITICAL
    enforced_by: test
    evidence: "SubscriptionPricingPolicy.java:52"
    test_ref: "SubscriptionPricingPolicyTest"
    status: verified_green   # ✅ 공식·롤오버 단위 테스트 통과

  - id: DOM_002
    text: "도메인 파일 5MB · 영상 1GB 한도"
    severity: CRITICAL
    enforced_by: test
    evidence: "application.yaml:134,142 / CourseCommandService:198"
