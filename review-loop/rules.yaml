# ============================================================================
# 규칙 카탈로그 (SSOT) — v2.0 · module06 (게이트용 소수 규칙으로 좁힘)
#
# 역할 분리: CodeRabbit(.coderabbit.yaml)이 광범위 '어드바이저리' 리뷰를 담당한다.
#   이 카탈로그(루프 Gate)는 CodeRabbit이 못 하는 것만 남긴다 —
#     (1) 결정론 하드 게이트 (ArchUnit·Semgrep·마이그레이션) → 머지 차단
#     (2) 최소한의 자율수정 대상 (judge 규칙) → P0/P1 루프가 코멘트가 아니라 '자동수정'
#   광범위 스타일·설계·일반 성능 지적은 여기 넣지 않는다(= CodeRabbit 몫, 중복/오탐 방지).
#
# status: verified_green(검증됨) / baseline(신규만 차단) / pending(집행수단 미구축) / judge_pending(LLM 몫)
# ============================================================================

version: "2.0"

meta:
  gates:
    gate1: "결정론 (ArchUnit·Semgrep·마이그레이션) — 비용 0. 위반 시 머지 차단."
    gate2: "LLM Judge — CodeRabbit과 중복하지 않는 자율수정 대상 최소 규칙만."
  severity:
    CRITICAL: "걸리면 무조건 사람 승인 (자동수정·머지 금지)"
    MINOR: "자동수정 루트 허용 (≤3회)"
  score:
    formula: "100 - Σ(weight) — LLM이 아니라 코드가 결정론으로 계산. acceptance는 가중치 제외."
    pass_threshold: 80         # score >= 80 → PASS, 미만 → 재수정 (Critical은 점수 무관 사람 승인)
    default_weight:
      CRITICAL: 40
      MINOR: 10
    judge_default_weight: 15   # 의미규칙(judge) 기본 감점

rules:
  # ── Gate 1 · 결정론 하드 게이트 (CodeRabbit이 '강제'하지 못하는 것) ─────────
  - id: ARCH_001
    text: "presentation(컨트롤러)은 domain.repository 직접호출 금지 → Service 경유"
    severity: MINOR
    enforced_by: archunit
    archunit_ref: "ArchitectureRulesTest#presentationMustNotAccessRepositoryDirectly"
    status: pending          # ArchitectureRulesTest 미작성(컨벤션 팀원) → 작성 시 자동 활성화

  - id: ARCH_002
    text: "domain.model은 Spring·JPA 의존 금지 (순수 POJO)"
    severity: MINOR
    enforced_by: archunit
    archunit_ref: "ArchitectureRulesTest#domainModelMustNotDependOnFramework"
    status: pending

  - id: ARCH_003
    text: "application → infrastructure 직접 참조 금지 (포트-어댑터)"
    severity: MINOR
    enforced_by: archunit
    archunit_ref: "ArchitectureRulesTest#applicationMustNotDependOnInfrastructure"
    status: pending          # 신규 레포 — 부채(baseline) 없이 위반 0에서 시작

  - id: QUERY_002
    text: "신규 @Query(JPQL/native) 추가 금지 — 파생 쿼리 메서드로 대체"
    severity: MINOR
    enforced_by: semgrep
    semgrep_rule: "review-loop/semgrep/query.yml"
    status: verified_green   # semgrep query.yml 존재 · CI(gate1-semgrep)에서 baseline-diff 실행

  - id: MIG_001
    text: "스키마 변경은 마이그레이션으로만 · ddl-auto=validate (update 금지)"
    severity: CRITICAL
    enforced_by: [ci]
    status: pending          # Flyway·스키마드리프트 CI 미설정 → 붙으면 활성화

  # ── Gate 2 · LLM Judge (자율수정 대상 · CodeRabbit과 '행동 층'이 다름) ──────
  # CodeRabbit은 이 항목들을 사람에게 '코멘트'로 알려주고, 루프는 '자동수정'한다.
  # (테스트 회귀 가드가 judge 규칙 = 정확히 3개를 고정한다. 개수 변경 시 테스트 동반 수정.)
  - id: CONV_001
    text: "새 유틸 만들기 전 global 검색 — 중복 재발명 금지 (예: 주입된 Clock 대신 now() 직접 사용)"
    severity: MINOR
    enforced_by: judge
    anchor: "표준 유틸(주입된 Clock·공통 유틸)을 우회해 재발명하지 말 것"
    status: judge_pending

  - id: PERF_001
    text: "N+1 금지 — 단일→fetch join / 다중→batch size / 집계→비정규화"
    severity: MINOR
    enforced_by: judge
    anchor: "루프 안에서 건별 조회 대신 배치 조회(IN절·fetch join)"
    status: judge_pending

  - id: ARCH_003a
    text: "타 도메인 JpaEntity 읽기 참조 — 투영(read model)은 예외 허용"
    severity: MINOR
    enforced_by: judge       # ArchUnit로 후보 탐지 + 투영 예외 판단은 Judge
    status: judge_pending

# ── NOTE — 비채점 인지 항목 ────────────────────────────────────────────────
# Judge가 위반으로 오판하기 쉬운 의도적 결정. 감점 대상 아님. flag하면 오판으로 error_log에 기록.
notes:
  - id: NOTE_001
    text: "ADR로 승인된 의도적 성능 결정(예: 비정규화 count)은 되돌리지 말 것"
    scored: false
