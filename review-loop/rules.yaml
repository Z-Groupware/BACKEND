  - id: QDIFF_005
    text: "difficulty TINYINT 매핑·저장 (schema-validation 통과)"
    severity: MINOR
    enforced_by: [test, ci]
    evidence: "V3.5.1__add_difficulty_to_quiz_question.sql / QuizQuestionJpaEntity"
