  - id: MIG_001
    text: "스키마 변경은 마이그레이션으로만 · ddl-auto=validate (update 금지)"
    severity: CRITICAL
    enforced_by: [test, ci]
    evidence: "application.yaml:31 / pr-ci.yml schema-validation 잡"
    status: claimed        # CI 드리프트 게이트는 실재(pr-ci.yml), 규칙-테스트 매핑만 미확인

  # ── 시범 기능(Q3): 퀴즈 문항 난이도 — Gate 1 전용, 코드 실독 검증 ──────────
  - id: QDIFF_001
    text: "API 등록 요청 난이도 필수·1~3, 범위 밖이면 400 (QDIFF_002 정답번호·보기수 포함)"
    severity: MINOR
    enforced_by: test
    evidence: "InstructorQuizRequest.java:23-30"
    test_ref: "InstructorQuizRequestValidationTest"
    status: verified_green   # ✅ Bean Validation 단위 테스트 통과

  - id: QDIFF_003
