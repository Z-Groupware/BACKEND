name: z

services:
  spring:
    image: "${SPRING_IMAGE:?SPRING_IMAGE is required}"
    container_name: z-spring

    env_file:
      - path: "${RUNTIME_ENV_FILE:-./.env.runtime}"
        format: raw

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    restart: unless-stopped
    stop_grace_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:8.8.1-alpine
    container_name: z-redis

    env_file:
      - path: "${RUNTIME_ENV_FILE:-./.env.runtime}"
        format: raw

    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$${REDIS_PASSWORD}"

    volumes:
      - redis-data:/data

    restart: unless-stopped
    mem_limit: 256m

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis-data: