name: z

services:
  spring:
    image: "${SPRING_IMAGE:?SPRING_IMAGE is required}"
    container_name: z-spring

    env_file:
      - path: "${RUNTIME_ENV_FILE:-./.env.runtime}"
        format: raw

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    restart: unless-stopped
    stop_grace_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:8.8.1-alpine
    container_name: z-redis

    env_file:
      - path: "${RUNTIME_ENV_FILE:-./.env.runtime}"
        format: raw

    command:
      - sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

        case "$${REDIS_PASSWORD}" in
          *[!0-9a-f]*)
            echo "REDIS_PASSWORD must be lowercase hexadecimal" >&2
            exit 1
            ;;
        esac

        if [ "$${#REDIS_PASSWORD}" -ne 64 ]; then
          echo "REDIS_PASSWORD must be 64 characters" >&2
          exit 1
        fi

        umask 077
        printf 'appendonly yes\nappendfsync everysec\nrequirepass %s\n' \
          "$${REDIS_PASSWORD}" > /run/redis-config/redis.conf

        chown redis:redis /run/redis-config/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh \
          redis-server /run/redis-config/redis.conf

    volumes:
      - redis-data:/data

    tmpfs:
      - /run/redis-config

    restart: unless-stopped
    mem_limit: 256m

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis-data: