name: z

services:
  spring:
    image: "${SPRING_IMAGE:?SPRING_IMAGE is required}"
    container_name: z-spring

    env_file:
      - path: "${RUNTIME_ENV_FILE:-./.env.runtime}"
        format: raw

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    restart: unless-stopped
    stop_grace_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:8.8.1-alpine
    container_name: z-redis

    env_file:
      - path: "${RUNTIME_ENV_FILE:-./.env.runtime}"
        format: raw

    command:
      - sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

        case "$${REDIS_PASSWORD}" in
          *[!0-9a-f]*)
            echo "REDIS_PASSWORD must be lowercase hexadecimal" >&2
            exit 1
            ;;
        esac

        if [ "$${#REDIS_PASSWORD}" -ne 64 ]; then
          echo "REDIS_PASSWORD must be 64 characters" >&2
          exit 1
        fi

        umask 077
        printf 'appendonly yes\nappendfsync everysec\nmaxmemory 128mb\nmaxmemory-policy noeviction\nrequirepass %s\n' \
          "$${REDIS_PASSWORD}" > /run/redis-config/redis.conf

        chown redis:redis /run/redis-config/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh \
          redis-server /run/redis-config/redis.conf

    volumes:
      - redis-data:/data

    tmpfs:
      - /run/redis-config

    restart: unless-stopped
    mem_limit: 256m

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis_exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: z-redis-exporter

    # redis_exporter만 필요한 REDIS_PASSWORD 하나 때문에 전체 시크릿이 담긴
    # RUNTIME_ENV_FILE(.env.runtime)을 통째로 넘기지 않는다 (env_file 제거).
    # REDIS_PASSWORD는 아래 Compose 변수 치환으로만 주입한다.
    #
    # 주의: 이 치환이 동작하려면 REDIS_PASSWORD가 `docker compose`를 실행하는
    # 셸의 환경변수로 존재해야 한다. 현재 infra/deploy.sh는 SSM 값을
    # RUNTIME_ENV_FILE(.env.runtime)에 파일로만 기록할 뿐, 그 값들을 셸
    # 환경으로 export/source하지는 않는다 (deploy.sh 확인 결과). 따라서
    # redis_exporter를 (재)기동하는 배포 도구는 별도로 REDIS_PASSWORD를
    # 셸에 노출시켜야 한다 (예: `set -a; source .env.runtime; set +a` 또는
    # `docker compose --env-file .env.runtime ...`).
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "9121:9121"

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis-data: