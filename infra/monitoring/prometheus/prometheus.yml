global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "z-spring"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["<BACKEND_EC2_PRIVATE_IP>:8080"]
        labels:
          service: z-spring

  - job_name: "z-redis"
    static_configs:
      - targets: ["<BACKEND_EC2_PRIVATE_IP>:9121"]
        labels:
          service: z-redis
