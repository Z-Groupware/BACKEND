apiVersion: 1

groups:
  - orgId: 1
    name: z-alerts
    folder: Z
    interval: 1m
    rules:
      - uid: z-alert-5xx-rate
        title: "5xx 에러율 급증"
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "z-spring 5xx 에러율이 5%를 초과했습니다"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[1m])) / sum(rate(http_server_requests_seconds_count[1m]))"
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: z-alert-heap
        title: "힙 메모리 위험"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "z-spring 힙 메모리 사용률이 85%를 초과했습니다"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: "sum(jvm_memory_used_bytes{area=\"heap\"}) / sum(jvm_memory_max_bytes{area=\"heap\"})"
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.85] }

      - uid: z-alert-redis-memory
        title: "Redis 메모리 위험"
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "z-redis 메모리 사용률이 80%를 초과했습니다"
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              refId: A
              instant: true
              expr: "redis_memory_used_bytes / redis_memory_max_bytes"
          - refId: C
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.80] }

    policies:
      - orgId: 1
        receiver: slack-alerts
